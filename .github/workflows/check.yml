name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - run: node .yarn/releases/yarn-4.18.1.cjs check
